kind = "mobile"
previewPath = "/groundcheck-mobile/"
title = "GroundCheck Mobile"
version = "1.0.0"
id = "artifacts/groundcheck-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/groundcheck-mobile/" ]
localPort = 23929

[services.development]
run = "pnpm --filter @workspace/groundcheck-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/groundcheck-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/groundcheck-mobile", "run", "serve" ]

[services.env]
PORT = "23929"
BASE_PATH = "/groundcheck-mobile/"
